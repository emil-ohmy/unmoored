<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1b22; --panel: #16262f; --panel2: #1c303b; --line: #2b4351; --ink: #ece6d8; --dim: #a9a394;
    --accent: #e0b470; --water: #142a33; --sel: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 Inter, system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 250px 1fr 270px; grid-template-rows: 46px 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font: 22px "IM Fell English SC", serif; margin: 0 14px 0 2px; color: var(--accent); white-space: nowrap; }
  header .name { color: var(--dim); margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, select, input { font: inherit; color: var(--ink); }
  header select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.on { background: #3a3324; border-color: var(--accent); color: #fff3d8; }
  .tools { display: flex; gap: 4px; }
  aside { background: var(--panel); overflow-y: auto; border-right: 1px solid var(--line); padding: 10px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  aside h2 { font: 17px "IM Fell English SC", serif; margin: 12px 0 6px; color: var(--accent); }
  aside h3 { font: 14px "IM Fell English SC", serif; margin: 12px 0 5px; }
  .stickers { display: flex; flex-wrap: wrap; gap: 4px; }
  .sticker { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 3px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; background: transparent; font-size: 12px; }
  .sticker:hover { border-color: var(--line); background: var(--panel2); }
  .sticker.on { border-color: var(--accent); background: #3a3324; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 8px Inter; color: #fff; border: 1.5px solid #f4efe3; flex: none; }
  .swatch { width: 22px; height: 16px; border-radius: 3px; flex: none; border: 1px solid #0006; }
  main { position: relative; overflow: hidden; background: var(--water); }
  svg { width: 100%; height: 100%; display: block; cursor: crosshair; user-select: none; }
  svg.panning { cursor: grabbing; }
  .hint { position: absolute; left: 10px; bottom: 10px; color: var(--dim); font-size: 12px; background: #0f1b22cc; padding: 6px 9px; border-radius: 6px; pointer-events: none; max-width: 70%; }
  .coords { position: absolute; right: 10px; bottom: 10px; color: var(--dim); font: 12px ui-monospace, monospace; background: #0f1b22cc; padding: 5px 8px; border-radius: 6px; pointer-events: none; }
  .field { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin: 6px 0; }
  .field input, .field select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
  textarea { min-height: 64px; resize: vertical; color: var(--ink); font: inherit; }
  .muted { color: var(--dim); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  kbd { font: 11px ui-monospace, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  ul.help { padding-left: 16px; margin: 6px 0; color: var(--dim); }
  ul.help li { margin: 3px 0; }
  .toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #3a3324; border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .notelist { list-style: none; padding: 0; margin: 4px 0; }
  .notelist li { background: #f3e6b9; color: #2b2416; border-radius: 4px; padding: 5px 7px; margin: 5px 0; cursor: pointer; font-size: 12px; white-space: pre-wrap; }
  .notelist li:hover { outline: 2px solid var(--accent); }
  .notelist li b { font-weight: 600; color: #6b5427; display: block; font-size: 11px; }
  .unsaved { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Level Editor</h1>
  <span class="name" id="levelName">untitled</span>
  <div class="tools" id="tools"></div>
  <button id="undo" title="Undo (⌘Z)">Undo</button>
  <button id="redo" title="Redo (⇧⌘Z)">Redo</button>
  <button id="new">New</button>
  <select id="levels" title="The levels in game/Assets/_Project/Levels" hidden></select>
  <button id="open">Open…</button>
  <button id="save" title="Save (⌘S)">Save</button>
  <button id="saveAs">Save as…</button>
</header>

<aside id="palette">
  <h2>Floors</h2>
  <div class="muted">The walkable space. Everything else is the area's rock (or its water). Draw a path for anything winding.</div>
  <div class="stickers" id="floorKinds"></div>
  <h2>Set pieces</h2>
  <div class="muted">Pick one, then click to place it. Its centre is where it stands.</div>
  <div id="stickerGroups"></div>
</aside>

<main id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="hint" id="hint"></div>
  <div class="coords" id="coords"></div>
  <div class="toast" id="toast"></div>
</main>

<aside class="right" id="inspector"></aside>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
"use strict";
// ---------------------------------------------------------------- the vocabulary (the Figma sticker sheet's)
const GROUPS = [
  ["Places", "#3c8b86", [["START", "Start (you begin here)"], ["MP", "Mooring post"], ["AE", "Area entrance"], ["DK", "Dock (and its bell)"], ["SG", "Shortcut (one-way)"], ["HP", "Hook post"], ["AG", "Arena gate (seals the fight)"], ["VOICE", "The voice (a tutorial line)"], ["MSG", "Message on the floor"],["SEAL", "Sealed door (opens later in the game)"]]],
  ["Ability gates", "#7a5aa6", [["HK", "Gate: Hook"], ["ST", "Gate: Stroke"], ["VT", "Gate: Vault"]]],
  ["Bosses", "#9c2f3a", [["BOSS", "Boss arena (a new Boss)"], ["HOLD", "The Hold, That Would Not Let Go"], ["ANC", "The Antediluvian Anchoress"], ["MOTH", "Father Moth (the Gardener)"], ["HOUR", "The One Who Waits"], ["FERR", "The Ferryman"]]],
  ["Minibosses", "#b3505c", [["MB", "Miniboss (a new one)"], ["UNP", "The Unparted (Hold and Fast)"], ["WAT", "The Watchman (Abner Wick)"], ["WID", "The Widow Hale"]]],
  ["Souls", "#b8893a", [["LG", "Lingerer"], ["ME", "Merchant soul"], ["KS", "Keepsake"]]],
  ["Finds", "#c9a63c", [["OB", "Obol cache"], ["FN", "Ferry Nail"], ["WS", "Warm Stone (more health)"], ["HB", "Held Breath (more stamina)"], ["EM", "Ember (a Healing charge)"], ["CH", "Charm"], ["REL", "Ability relic"], ["PV", "Provision"]]],
  ["Provisions", "#b8963e", [["PP", "Pitch Pot"], ["ET", "Ember Tar"], ["WB", "The Way Back"], ["BR", "Warm Broth"], ["RT", "Bitter Root"], ["SS", "Sodden Sack"]]],
  ["Soured", "#b44a3e", [["LA", "Laden"], ["AR", "Laden archer"], ["CL", "Clingers (a pair)"], ["DR", "Drowned"], ["GL", "Gleaner"], ["TH", "Thresher"], ["MO", "Moths"], ["PU", "Punctual"], ["WO", "Wound"], ["KE", "Keener"], ["KP", "The Kept"], ["SC", "Scarecrows"]]],
  ["Traps and devices", "#c46f2c", [["PB", "Pendulum blades"], ["RG", "Rolling gear"], ["CJ", "Clock jacks"], ["GF", "Grinding floor"], ["CU", "Current"], ["SL", "Sluice gate"], ["SP", "Strike-plate (the Stroke starts it)"], ["LI", "Clockwork lift"], ["CD", "Clockwork door"], ["MR", "Mill race"], ["WW", "Water wheel"], ["SH", "Loose barrels or crates"], ["TP", "Pocket of moving time"], ["SA", "Still air (time stopped)"]]],
  ["The Hold's walls", "#8e9ab0", [["EYE", "An eye that follows"], ["FACE", "A face pressing out"], ["HAND", "A hand pressing out"], ["DRIP", "Drips (all through it)"], ["EYED", "The door of eyes (won't open yet)"]]],
  ["Light and cover", "#6f6a5d", [["LT", "Lantern"], ["TO", "Torch"], ["BZ", "Brazier"], ["CV", "Cover (crates, barrels)"], ["BN", "Bench"], ["RK", "Rocks"], ["RW", "Ruined wall"], ["MK", "Way marker"]]],
];
const STICKER = {};
for (const [group, colour, items] of GROUPS) for (const [code, name] of items) STICKER[code] = { code, name, group, colour };
// Floors: the walkable ground, by height (+0.5 the shore and the quays, +2.4 a storey up...), and shallow water.
const FLOOR_KINDS = [
  { top: 0.5, name: "Ground +0.5", colour: "#5f6a52" },
  { top: 2.4, name: "Ground +2.4", colour: "#857f66" },
  { top: 4.8, name: "Ground +4.8", colour: "#aaa284" },
  { top: -0.2, name: "Shallow water (wade)", colour: "#2f5a63" },
];
const floorColour = top => (FLOOR_KINDS.find(k => Math.abs(k.top - top) < 0.01) || FLOOR_KINDS[0]).colour;

// ---------------------------------------------------------------- the level
// Metres: e east, n north. Floors: rect {e, n, w, h, rot} (its centre, size, degrees), circle {e, n, r},
// path {points: [[e, n]...], width}; each with `top` (its height). Markers {code, label, e, n}; notes {text, e, n}.
let level = blank();
let fileHandle = null;
let server = false;          // served by tools/level-editor/serve.py: it reads and writes the repo's Levels/
let fileName = null;         // (the level's file there)
function blank() {
  return { format: "level/2", name: "untitled", scale: 1, notes_for_the_builder: "", floors: [], markers: [], notes: [] };
}
let selection = null;      // {kind: "floor"|"marker"|"note", index}
let tool = "select";        // select | rect | circle | path | note | sticker
let stickerCode = null;
let floorTop = 0.5;
let labels = true;          // (L: show the set pieces' labels)
let showNotes = true;       // (N: show the notes pinned to floors and set pieces)
let savedText = null;       // the level as last opened or saved (to know what isn't saved yet)
const levelText = () => JSON.stringify(level);
const dirty = () => savedText !== null ? levelText() !== savedText : (level.floors.length + level.markers.length + level.notes.length) > 0;
let drawing = null;         // a path being drawn
const history = [], future = [];
function snapshot() { history.push(JSON.stringify(level)); if (history.length > 200) history.shift(); future.length = 0; }
function undo() { if (!history.length) return; future.push(JSON.stringify(level)); level = JSON.parse(history.pop()); selection = null; render(); }
function redo() { if (!future.length) return; history.push(JSON.stringify(level)); level = JSON.parse(future.pop()); selection = null; render(); }

// ---------------------------------------------------------------- the view
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
let view = { cx: 0, cn: 0, ppm: 8 };   // the centre (metres) and pixels per metre
const snap = v => Math.round(v * 2) / 2;
function toScreen(e, n) { const r = svg.getBoundingClientRect(); return [r.width / 2 + (e - view.cx) * view.ppm, r.height / 2 - (n - view.cn) * view.ppm]; }
function toWorld(x, y) { const r = svg.getBoundingClientRect(); return [view.cx + (x - r.width / 2) / view.ppm, view.cn - (y - r.height / 2) / view.ppm]; }
function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

function render() {
  svg.innerHTML = "";
  const r = svg.getBoundingClientRect();
  const [e0, n1] = toWorld(0, 0), [e1, n0] = toWorld(r.width, r.height);
  // The grid: every metre (when close enough to see), every 5 m, every 25 m.
  const g = el("g", {}, svg);
  for (const [step, alpha] of [[1, 0.045], [5, 0.1], [25, 0.18]]) {
    if (step * view.ppm < 6) continue;
    for (let e = Math.floor(e0 / step) * step; e <= e1; e += step) { const [x] = toScreen(e, 0); el("line", { x1: x, x2: x, y1: 0, y2: r.height, stroke: `rgba(255,255,255,${alpha})` }, g); }
    for (let n = Math.floor(n0 / step) * step; n <= n1; n += step) { const [, y] = toScreen(0, n); el("line", { y1: y, y2: y, x1: 0, x2: r.width, stroke: `rgba(255,255,255,${alpha})` }, g); }
  }
  const [ox, oy] = toScreen(0, 0);
  el("circle", { cx: ox, cy: oy, r: 3, fill: "rgba(255,255,255,.35)" }, g);
  // Floors, in order (later on top).
  level.floors.forEach((f, i) => drawFloor(f, i));
  if (drawing) drawFloor(drawing, -1, true);
  // Notes and markers.
  level.notes.forEach((t, i) => drawNote(t, i));
  level.markers.forEach((m, i) => drawMarker(m, i));
  if (showNotes) {
    placed = [];
    level.floors.forEach((f, i) => { if (f.note) drawPinned(f.note, floorAnchor(f), "floor", i); });
    level.markers.forEach((m, i) => { if (m.note) drawPinned(m.note, markerAnchor(m), "marker", i); });
  }
  // North, and the camera.
  const [nx, ny] = [r.width - 34, 40];
  el("path", { d: `M ${nx} ${ny + 34} V ${ny} M ${nx - 9} ${ny + 11} L ${nx} ${ny} L ${nx + 9} ${ny + 11}`, stroke: "#ece6d8", "stroke-width": 2.5, fill: "none", "stroke-linecap": "round" }, svg);
  const nt = el("text", { x: nx, y: ny + 52, fill: "#ece6d8", "text-anchor": "middle", "font-family": "IM Fell English SC", "font-size": 18 }, svg); nt.textContent = "N";
  // A 10 m scale bar.
  const bar = 10 * view.ppm, bx = 14, by = 30;
  el("rect", { x: bx, y: by, width: bar, height: 5, fill: "#ece6d8" }, svg);
  el("rect", { x: bx, y: by, width: bar / 2, height: 5, fill: "#5d6a70" }, svg);
  const bt = el("text", { x: bx, y: by + 18, fill: "#a9a394", "font-size": 11 }, svg); bt.textContent = "10 m";
  inspector();
  const nameEl = document.getElementById("levelName");
  nameEl.textContent = (level.name || "untitled") + (server ? (fileName ? `  —  Levels/${fileName}.json` : "  (not saved yet)") : fileHandle ? "" : "  (not saved to a file yet)");
  if (dirty()) { const u = document.createElement("span"); u.className = "unsaved"; u.textContent = "  •  unsaved changes (⌘S)"; nameEl.appendChild(u); }
  try { localStorage.setItem("levelEditor.autosave", JSON.stringify({ fileName, level, savedText })); } catch (_) {}
}

function isSel(kind, i) { return selection && selection.kind === kind && selection.index === i; }

function drawFloor(f, i, ghost) {
  const g = el("g", { "data-kind": "floor", "data-index": i }, svg);
  const fill = floorColour(f.top);
  const sel = isSel("floor", i);
  const stroke = sel ? "#ffd27a" : "rgba(0,0,0,.35)";
  if (f.type === "rect") {
    const [x, y] = toScreen(f.e, f.n);
    el("rect", { x: x - f.w * view.ppm / 2, y: y - f.h * view.ppm / 2, width: f.w * view.ppm, height: f.h * view.ppm, fill, stroke, "stroke-width": sel ? 2 : 1,
                 transform: `rotate(${-(f.rot || 0)} ${x} ${y})` }, g);
  } else if (f.type === "circle") {
    const [x, y] = toScreen(f.e, f.n);
    el("circle", { cx: x, cy: y, r: f.r * view.ppm, fill, stroke, "stroke-width": sel ? 2 : 1 }, g);
  } else if (f.type === "path") {
    const d = f.points.map((p, k) => { const [x, y] = toScreen(p[0], p[1]); return (k ? "L" : "M") + x + " " + y; }).join(" ");
    if (sel) el("path", { d, fill: "none", stroke: "#ffd27a", "stroke-width": f.width * view.ppm + 4, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.8 }, g);
    el("path", { d, fill: "none", stroke: fill, "stroke-width": f.width * view.ppm, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: ghost ? 0.7 : 1 }, g);
    if (sel || ghost) f.points.forEach((p, k) => {
      const [x, y] = toScreen(p[0], p[1]);
      el("circle", { cx: x, cy: y, r: 5, fill: "#ffd27a", stroke: "#3a3324", "data-point": k, class: "handle" }, g);
    });
  }
  if (sel && f.type !== "path") {   // a handle to resize from
    const [x, y] = toScreen(f.e, f.n);
    let hx, hy;
    if (f.type === "circle") { hx = x + f.r * view.ppm; hy = y; }
    else { const a = (f.rot || 0) * Math.PI / 180, dx = f.w / 2, dn = -f.h / 2; [hx, hy] = toScreen(f.e + dx * Math.cos(a) - dn * Math.sin(a), f.n + dx * Math.sin(a) + dn * Math.cos(a)); }
    el("rect", { x: hx - 5, y: hy - 5, width: 10, height: 10, fill: "#ffd27a", stroke: "#3a3324", "data-resize": 1, class: "handle" }, g);
  }
}

function drawMarker(m, i) {
  const s = STICKER[m.code] || { colour: "#777", name: m.code };
  const [x, y] = toScreen(m.e, m.n);
  const g = el("g", { "data-kind": "marker", "data-index": i, style: "cursor: move" }, svg);
  const rad = Math.max(9, Math.min(16, 1.3 * view.ppm));
  if (isSel("marker", i)) el("circle", { cx: x, cy: y, r: rad + 4, fill: "none", stroke: "#ffd27a", "stroke-width": 2 }, g);
  el("circle", { cx: x, cy: y, r: rad, fill: s.colour, stroke: "#f4efe3", "stroke-width": 1.5 }, g);
  const t = el("text", { x, y: y + 3, fill: "#fff", "text-anchor": "middle", "font-weight": 700, "font-size": m.code.length > 2 ? 7 : 9 }, g); t.textContent = m.code;
  // Its label: only what's been written on it (its kind is in its circle and on hover), the first part, kept short.
  const tip = el("title", {}, g); tip.textContent = (m.label ? m.label + "\n" : "") + (s.name || m.code);
  if (m.label && view.ppm > 3.5 && labels) {
    let text = m.label.split(" / ")[0];
    if (text.length > 30) text = text.slice(0, 29) + "…";
    const l = el("text", { x, y: y + rad + 12, fill: "#ece6d8", "text-anchor": "middle", "font-size": 11, "font-weight": 500, "paint-order": "stroke", stroke: "#0f1b22", "stroke-width": 3 }, g);
    l.textContent = text;
  }
}

function drawNote(t, i) {
  const [x, y] = toScreen(t.e, t.n);
  const g = el("g", { "data-kind": "note", "data-index": i, style: "cursor: move" }, svg);
  const lines = (t.text || "").split("\n");
  const txt = el("text", { x, y, fill: isSel("note", i) ? "#ffd27a" : "#f1ebdd", "font-family": "IM Fell English", "font-style": "italic", "font-size": 14, "paint-order": "stroke", stroke: "#0f1b22", "stroke-width": 3 }, g);
  lines.forEach((line, k) => { const s = el("tspan", { x, dy: k ? 17 : 0 }, txt); s.textContent = line; });
}

// A note pinned to a floor or a set piece: where it's pinned (screen), above the thing.
function floorAnchor(f) {
  if (f.type === "circle") return toScreen(f.e, f.n + f.r);
  if (f.type === "rect") {
    const a = (f.rot || 0) * Math.PI / 180, cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
      const dx = sx * f.w / 2, dn = sy * f.h / 2; return toScreen(f.e + dx * Math.cos(a) - dn * Math.sin(a), f.n + dx * Math.sin(a) + dn * Math.cos(a)); });
    return [cs.reduce((s, c) => s + c[0], 0) / 4, Math.min(...cs.map(c => c[1]))];
  }
  // a path: half way along it
  let half = pathLength(f) / 2;
  for (let k = 1; k < f.points.length; k++) {
    const [a, b] = [f.points[k - 1], f.points[k]], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (half <= L || k === f.points.length - 1) { const t = L ? Math.min(1, half / L) : 0; return toScreen(a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])); }
    half -= L;
  }
  return toScreen(f.points[0][0], f.points[0][1]);
}
function markerAnchor(m) { const [x, y] = toScreen(m.e, m.n); return [x, y - Math.max(9, Math.min(16, 1.3 * view.ppm))]; }
function wrap(text, width) {
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/)) { if (line && (line + " " + word).length > width) { out.push(line); line = word; } else line = line ? line + " " + word : word; }
    out.push(line);
  }
  return out;
}
let placed = [];   // (the pinned notes drawn so far this frame: the next steps up out of their way)
function drawPinned(text, [x, y], kind, i) {
  const g = el("g", { "data-kind": kind, "data-index": i, style: "cursor: pointer" }, svg);
  let lines = wrap(text, 30);
  if (lines.length > 4) lines = lines.slice(0, 4), lines[3] = lines[3].replace(/.?.?$/, "…");
  const sel = isSel(kind, i);
  const stem = el("line", { x1: x, y1: y, stroke: "#f3e6b9", "stroke-width": 1.5 }, g);
  el("circle", { cx: x, cy: y, r: 2.5, fill: "#f3e6b9" }, g);
  const box = el("rect", { rx: 3, fill: "#f3e6b9", stroke: sel ? "#ffd27a" : "#0006", "stroke-width": sel ? 2 : 1, opacity: 0.96 }, g);
  const t = el("text", { fill: "#2b2416", "font-size": 11 }, g);
  const spans = lines.map((line, k) => { const s = el("tspan", { dy: k ? 14 : 0 }, t); s.textContent = line; return s; });
  const w = Math.max(...spans.map(s => s.getComputedTextLength())) + 14, h = lines.length * 14 + 9;
  let bx = x - w / 2, by = y - 14 - h;
  for (let tries = 0; tries < 12; tries++) {   // up, out of the way of the notes already there
    const o = placed.find(b => bx < b.x + b.w + 3 && b.x < bx + w + 3 && by < b.y + b.h + 3 && b.y < by + h + 3);
    if (!o) break;
    by = o.y - h - 4;
  }
  placed.push({ x: bx, y: by, w, h });
  stem.setAttribute("x2", x); stem.setAttribute("y2", by + h);
  Object.entries({ x: bx, y: by, width: w, height: h }).forEach(([k, v]) => box.setAttribute(k, v));
  t.setAttribute("x", bx + 7); t.setAttribute("y", by + 15);
  spans.forEach(s => s.setAttribute("x", bx + 7));

}
function noteField(box, item) {
  const t = document.createElement("h3"); t.textContent = "Note"; box.appendChild(t);
  const input = field(box, "", item.note || "", v => { if (v.trim()) item.note = v; else delete item.note; }, "textarea");
  input.placeholder = "For the builder: what this should be, e.g. \"a flat, built wall along its north side, the door of eyes in it\". Shown on the map, pinned to it.";
  return input;
}
// Every note in the level, to read them through.
function allNotes() {
  const out = [];
  level.floors.forEach((f, i) => { if (f.note) out.push({ kind: "floor", index: i, what: f.type === "path" ? "A path" : f.type === "circle" ? "A round floor" : "A rectangle", text: f.note }); });
  level.markers.forEach((m, i) => { if (m.note) out.push({ kind: "marker", index: i, what: (STICKER[m.code] || {}).name || m.code, text: m.note }); });
  level.notes.forEach((t, i) => out.push({ kind: "note", index: i, what: "On the map", text: t.text }));

}
function centreOn(kind, index) {
  const item = listOf(kind)[index];
  if (item.points) { const p = item.points[Math.floor(item.points.length / 2)]; view.cx = p[0]; view.cn = p[1]; }

}

// ---------------------------------------------------------------- the panels
function buildPalette() {
  const tools = document.getElementById("tools");
  for (const [id, label, key] of [["select", "Select", "V"], ["path", "Path", "P"], ["rect", "Rect", "R"], ["circle", "Round", "C"], ["note", "Note", "T"]]) {
    const b = document.createElement("button");
    b.textContent = label; b.title = `${label} (${key})`; b.dataset.tool = id;
    b.onclick = () => setTool(id);
    tools.appendChild(b);
  }
  const fk = document.getElementById("floorKinds");
  for (const k of FLOOR_KINDS) {
    const b = document.createElement("button");
    b.className = "sticker"; b.dataset.top = k.top;
    b.innerHTML = `<span class="swatch" style="background:${k.colour}"></span>${k.name}`;
    b.onclick = () => { floorTop = k.top; if (tool === "select" || tool === "sticker" || tool === "note") setTool("path"); else refreshButtons();
                        if (selection && selection.kind === "floor") { snapshot(); level.floors[selection.index].top = k.top; render(); } };
    fk.appendChild(b);
  }
  const groups = document.getElementById("stickerGroups");
  for (const [group, colour, items] of GROUPS) {
    const h = document.createElement("h3"); h.textContent = group; h.style.color = colour; groups.appendChild(h);
    const box = document.createElement("div"); box.className = "stickers"; groups.appendChild(box);
    for (const [code, name] of items) {
      const b = document.createElement("button");
      b.className = "sticker"; b.dataset.code = code; b.title = name;
      b.innerHTML = `<span class="dot" style="background:${colour};${code.length > 3 ? "font-size:6px;letter-spacing:-.3px" : ""}">${code}</span>${name}`;
      b.onclick = () => { stickerCode = code; setTool("sticker"); };
      box.appendChild(b);
    }
  }

}

function refreshButtons() {
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === tool));
  document.querySelectorAll("[data-code]").forEach(b => b.classList.toggle("on", tool === "sticker" && b.dataset.code === stickerCode));
  document.querySelectorAll("[data-top]").forEach(b => b.classList.toggle("on", Math.abs(+b.dataset.top - floorTop) < 0.01));
  const hints = {
    select: "Drag to move. Drag a path's points; double-click a path to add a point, Alt-click a point to remove it. Drag the yellow square to resize. Space-drag or right-drag to pan; scroll to zoom. Delete removes.",
    path: "Click to add points along the way; Enter or double-click to finish, Esc to cancel. Its width is set on the right.",
    rect: "Drag out a rectangle of floor.", circle: "Drag out a round floor from its centre.", note: "Click to write a note.",
    sticker: `Click to place: ${STICKER[stickerCode] ? STICKER[stickerCode].name : ""}. Esc to stop.`,
  };
  document.getElementById("hint").textContent = hints[tool];
}

function setTool(t) { if (drawing && t !== "path") finishPath(); tool = t; if (t !== "select") selection = null; refreshButtons(); render(); }

function field(parent, label, value, onChange, type = "text", step) {
  const row = document.createElement("label"); row.className = "field";
  row.innerHTML = `<span class="muted">${label}</span>`;
  const input = document.createElement(type === "textarea" ? "textarea" : "input");
  if (type !== "textarea") { input.type = type; if (step) input.step = step; }
  input.value = value;
  input.onchange = () => { snapshot(); onChange(type === "number" ? parseFloat(input.value) : input.value); render(); };
  if (type === "textarea") { row.style.gridTemplateColumns = "1fr"; }
  row.appendChild(input); parent.appendChild(row);
  return input;
}

function inspector() {
  const box = document.getElementById("inspector");
  box.innerHTML = "";
  const h = document.createElement("h2"); box.appendChild(h);
  if (!selection) {
    h.textContent = "The level";
    field(box, "Name", level.name, v => level.name = v);
    field(box, "Scale", level.scale, v => level.scale = v, "number", "0.05");
    const s = document.createElement("div"); s.className = "muted"; s.textContent = "The builder grows its metres by this (1: as drawn)."; box.appendChild(s);
    const t = document.createElement("h3"); t.textContent = "Notes for the builder"; box.appendChild(t);
    field(box, "", level.notes_for_the_builder || "", v => level.notes_for_the_builder = v, "textarea");
    const c = document.createElement("div"); c.className = "muted"; c.style.marginTop = "10px";
    c.innerHTML = `<b>${level.floors.length}</b> floors, <b>${level.markers.length}</b> set pieces, <b>${level.notes.length}</b> notes.`;
    box.appendChild(c);
    const notes = allNotes();
    if (notes.length) {
      const nh = document.createElement("h3"); nh.textContent = `Every note (${notes.length})`; box.appendChild(nh);
      const ul = document.createElement("ul"); ul.className = "notelist";

        const li = document.createElement("li");
        const b = document.createElement("b"); b.textContent = n.what; li.appendChild(b);
        li.appendChild(document.createTextNode(n.text));
        li.onclick = () => { selection = { kind: n.kind, index: n.index }; centreOn(n.kind, n.index); render(); };
        ul.appendChild(li);
      }
      box.appendChild(ul);
    }
    const help = document.createElement("div");
    help.innerHTML = `<h3>How it's read</h3><ul class="help">
      <li>North is up. The camera looks north from the south, so walls south of where you walk stay low.</li>
      <li>Floors are where you can walk; everything else is the area's rock (a cave's walls grow round them).</li>
      <li>It's a sketch: proportions and distances count, exact outlines don't.</li>
      <li>A set piece's centre is where it stands; its label says more ("Kept ×2").</li>
      <li>Anything the shapes can't say goes in a note: select a floor or a set piece and write in its Note ("a flat wall here"). It's pinned to it on the map; the builder reads them all.</li></ul>
      <h3>Keys</h3><ul class="help"><li><kbd>V</kbd> select, <kbd>P</kbd> path, <kbd>R</kbd> rect, <kbd>C</kbd> round, <kbd>T</kbd> note</li>
      <li><kbd>⌘Z</kbd> undo, <kbd>⇧⌘Z</kbd> redo, <kbd>⌘S</kbd> save, <kbd>⌘D</kbd> duplicate</li><li><kbd>F</kbd> fit the level in view, <kbd>L</kbd> labels on or off, <kbd>N</kbd> notes on or off</li></ul>`;
    box.appendChild(help);
    return;
  }
  const { kind, index } = selection;
  if (kind === "floor") {
    const f = level.floors[index];
    h.textContent = f.type === "path" ? "A path of floor" : f.type === "circle" ? "A round floor" : "A rectangle of floor";
    const sel = document.createElement("label"); sel.className = "field"; sel.innerHTML = `<span class="muted">Height</span>`;
    const s = document.createElement("select");
    for (const k of FLOOR_KINDS) { const o = document.createElement("option"); o.value = k.top; o.textContent = k.name; if (Math.abs(k.top - f.top) < 0.01) o.selected = true; s.appendChild(o); }
    s.onchange = () => { snapshot(); f.top = parseFloat(s.value); render(); };
    sel.appendChild(s); box.appendChild(sel);
    if (f.type === "path") {
      field(box, "Width (m)", f.width, v => f.width = Math.max(1, v), "number", "0.5");
      const p = document.createElement("div"); p.className = "muted"; p.textContent = `${f.points.length} points, ${pathLength(f).toFixed(0)} m long.`; box.appendChild(p);
    } else if (f.type === "circle") {
      field(box, "Radius (m)", f.r, v => f.r = Math.max(0.5, v), "number", "0.5");
    } else {
      field(box, "Width (m)", f.w, v => f.w = Math.max(0.5, v), "number", "0.5");
      field(box, "Depth (m)", f.h, v => f.h = Math.max(0.5, v), "number", "0.5");
      field(box, "Turned (°)", f.rot || 0, v => f.rot = v, "number", "5");
    }
    noteField(box, f);
  } else if (kind === "marker") {
    const m = level.markers[index], s = STICKER[m.code] || {};
    h.textContent = s.name || m.code;
    const d = document.createElement("div"); d.className = "muted"; d.textContent = `${s.group || ""} · ${m.code} · at ${m.e.toFixed(1)}, ${m.n.toFixed(1)}`; box.appendChild(d);
    const input = field(box, "Label", m.label || "", v => m.label = v, m.code === "MSG" || m.code === "VOICE" ? "textarea" : "text");
    if (m.code === "VOICE") { const p = document.createElement("div"); p.className = "muted"; p.textContent = "What the voice says as you come near, then the dry line with the controls: \"*Dodge*, Apprentice. / {dodge} to dodge...\". *Starred* words show in pale gold (what matters)."; box.appendChild(p); }
    if (m.code === "MSG") { const p = document.createElement("div"); p.className = "muted"; p.textContent = "What it says (the genre's template, then the dry line: \"Try dodging / {dodge} to dodge...\")."; box.appendChild(p); }

  } else {
    const t = level.notes[index];
    h.textContent = "A note";
    const input = field(box, "", t.text, v => t.text = v, "textarea");
    setTimeout(() => input.focus(), 0);
  }
  const row = document.createElement("div"); row.className = "row";
  const dup = document.createElement("button"); dup.textContent = "Duplicate"; dup.onclick = duplicate; row.appendChild(dup);
  const del = document.createElement("button"); del.textContent = "Delete"; del.onclick = removeSelected; row.appendChild(del);
  if (kind === "floor") {
    const up = document.createElement("button"); up.textContent = "To front"; up.onclick = () => { snapshot(); const [f] = level.floors.splice(index, 1); level.floors.push(f); selection.index = level.floors.length - 1; render(); }; row.appendChild(up);
  }
  box.appendChild(row);
}

function pathLength(f) { let L = 0; for (let k = 1; k < f.points.length; k++) L += Math.hypot(f.points[k][0] - f.points[k - 1][0], f.points[k][1] - f.points[k - 1][1]); return L; }

function removeSelected() {
  if (!selection) return;
  snapshot();
  const list = selection.kind === "floor" ? level.floors : selection.kind === "marker" ? level.markers : level.notes;
  list.splice(selection.index, 1);
  selection = null; render();
}

function duplicate() {
  if (!selection) return;
  snapshot();
  const list = selection.kind === "floor" ? level.floors : selection.kind === "marker" ? level.markers : level.notes;
  const copy = JSON.parse(JSON.stringify(list[selection.index]));
  if (copy.points) copy.points = copy.points.map(p => [p[0] + 2, p[1] - 2]); else { copy.e += 2; copy.n -= 2; }
  list.push(copy);
  selection = { kind: selection.kind, index: list.length - 1 };
  render();
}

// ---------------------------------------------------------------- the mouse
let drag = null;
function hit(evt) {
  let node = evt.target;
  const point = node.getAttribute && node.getAttribute("data-point");
  const resize = node.getAttribute && node.getAttribute("data-resize");
  while (node && node !== svg && !(node.getAttribute && node.getAttribute("data-kind"))) node = node.parentNode;
  if (!node || node === svg) return null;
  return { kind: node.getAttribute("data-kind"), index: +node.getAttribute("data-index"), point: point != null ? +point : null, resize: !!resize };
}

svg.addEventListener("contextmenu", e => e.preventDefault());
let spaceDown = false;
svg.addEventListener("pointerdown", evt => {
  svg.setPointerCapture(evt.pointerId);
  const [e, n] = toWorld(evt.offsetX, evt.offsetY);
  if (evt.button === 2 || evt.button === 1 || spaceDown) { drag = { pan: true, x: evt.clientX, y: evt.clientY, cx: view.cx, cn: view.cn }; svg.classList.add("panning"); return; }
  if (tool === "sticker" && stickerCode) {
    snapshot();
    level.markers.push({ code: stickerCode, label: "", e: snap(e), n: snap(n) });
    selection = { kind: "marker", index: level.markers.length - 1 };
    render(); return;
  }
  if (tool === "note") {
    snapshot();
    level.notes.push({ text: "A note", e: snap(e), n: snap(n) });
    selection = { kind: "note", index: level.notes.length - 1 };
    setTool("select"); selection = { kind: "note", index: level.notes.length - 1 }; render(); return;
  }
  if (tool === "path") {
    if (!drawing) drawing = { type: "path", top: floorTop, width: 6, points: [] };
    drawing.points.push([snap(e), snap(n)]);
    render(); return;
  }
  if (tool === "rect" || tool === "circle") {
    snapshot();
    const f = tool === "rect" ? { type: "rect", top: floorTop, e: snap(e), n: snap(n), w: 1, h: 1, rot: 0 } : { type: "circle", top: floorTop, e: snap(e), n: snap(n), r: 1 };
    level.floors.push(f);
    selection = { kind: "floor", index: level.floors.length - 1 };
    drag = { create: true, e0: snap(e), n0: snap(n) };
    render(); return;
  }
  // Select.
  const h = hit(evt);
  if (!h) { selection = null; render(); return; }
  if (h.kind === "floor" && h.point != null && evt.altKey) {
    const f = level.floors[h.index];
    if (f.points.length > 2) { snapshot(); f.points.splice(h.point, 1); }
    render(); return;
  }
  snapshot();
  selection = { kind: h.kind, index: h.index };
  drag = { e0: e, n0: n, point: h.point, resize: h.resize, orig: JSON.parse(JSON.stringify(listOf(h.kind)[h.index])) };
  render();
});

function listOf(kind) { return kind === "floor" ? level.floors : kind === "marker" ? level.markers : level.notes; }

svg.addEventListener("pointermove", evt => {
  const [e, n] = toWorld(evt.offsetX, evt.offsetY);
  document.getElementById("coords").textContent = `${e.toFixed(1)} E   ${n.toFixed(1)} N`;
  if (!drag) return;
  if (drag.pan) { view.cx = drag.cx - (evt.clientX - drag.x) / view.ppm; view.cn = drag.cn + (evt.clientY - drag.y) / view.ppm; render(); return; }
  if (drag.create) {
    const f = level.floors[selection.index];
    if (f.type === "rect") { f.w = Math.max(0.5, Math.abs(snap(e) - drag.e0)); f.h = Math.max(0.5, Math.abs(snap(n) - drag.n0)); f.e = (snap(e) + drag.e0) / 2; f.n = (snap(n) + drag.n0) / 2; }
    else f.r = Math.max(0.5, snap(Math.hypot(e - drag.e0, n - drag.n0)));
    render(); return;
  }
  const item = listOf(selection.kind)[selection.index], o = drag.orig;
  const de = snap(e - drag.e0), dn = snap(n - drag.n0);
  if (drag.point != null) { item.points[drag.point] = [snap(o.points[drag.point][0] + (e - drag.e0)), snap(o.points[drag.point][1] + (n - drag.n0))]; }
  else if (drag.resize) {
    if (item.type === "circle") item.r = Math.max(0.5, snap(Math.hypot(e - item.e, n - item.n)));
    else { const a = (item.rot || 0) * Math.PI / 180, x = e - item.e, y = n - item.n; item.w = Math.max(0.5, snap(2 * Math.abs(x * Math.cos(a) + y * Math.sin(a)))); item.h = Math.max(0.5, snap(2 * Math.abs(-x * Math.sin(a) + y * Math.cos(a)))); }
  }
  else if (item.points) item.points = o.points.map(p => [p[0] + de, p[1] + dn]);
  else { item.e = o.e + de; item.n = o.n + dn; }
  render();
});

svg.addEventListener("pointerup", () => { if (drag && drag.create) setTool("select"), selection = { kind: "floor", index: level.floors.length - 1 }; drag = null; svg.classList.remove("panning"); render(); });

svg.addEventListener("dblclick", evt => {
  if (tool === "path") { finishPath(); return; }
  const h = hit(evt);
  if (h && h.kind === "floor" && level.floors[h.index].type === "path") {   // a point where you double-click, on the nearest segment
    const f = level.floors[h.index];
    const [e, n] = toWorld(evt.offsetX, evt.offsetY);
    let best = 0, bd = 1e18;
    for (let k = 1; k < f.points.length; k++) {
      const [a, b] = [f.points[k - 1], f.points[k]];
      const t = Math.max(0, Math.min(1, ((e - a[0]) * (b[0] - a[0]) + (n - a[1]) * (b[1] - a[1])) / ((b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2 || 1)));
      const d = (a[0] + t * (b[0] - a[0]) - e) ** 2 + (a[1] + t * (b[1] - a[1]) - n) ** 2;
      if (d < bd) { bd = d; best = k; }
    }
    snapshot(); f.points.splice(best, 0, [snap(e), snap(n)]); selection = { kind: "floor", index: h.index }; render();
  }
});

svg.addEventListener("wheel", evt => {
  evt.preventDefault();
  const [e, n] = toWorld(evt.offsetX, evt.offsetY);
  view.ppm = Math.max(1.5, Math.min(60, view.ppm * Math.exp(-evt.deltaY * 0.0015)));
  const [e2, n2] = toWorld(evt.offsetX, evt.offsetY);
  view.cx += e - e2; view.cn += n - n2;
  render();
}, { passive: false });

function finishPath() {
  if (drawing && drawing.points.length >= 2) { snapshot(); level.floors.push(drawing); selection = { kind: "floor", index: level.floors.length - 1 }; drawing = null; tool = "select"; refreshButtons(); }
  else drawing = null;
  render();
}

function fit() {
  const pts = [];
  for (const f of level.floors) { if (f.points) pts.push(...f.points); else pts.push([f.e - (f.w || f.r * 2) / 2, f.n - (f.h || f.r * 2) / 2], [f.e + (f.w || f.r * 2) / 2, f.n + (f.h || f.r * 2) / 2]); }
  for (const m of level.markers) pts.push([m.e, m.n]);
  if (!pts.length) { view = { cx: 0, cn: 0, ppm: 8 }; render(); return; }
  const es = pts.map(p => p[0]), ns = pts.map(p => p[1]);
  const r = svg.getBoundingClientRect();
  view.cx = (Math.min(...es) + Math.max(...es)) / 2; view.cn = (Math.min(...ns) + Math.max(...ns)) / 2;
  view.ppm = Math.max(1.5, Math.min(40, 0.85 * Math.min(r.width / (Math.max(...es) - Math.min(...es) + 10), r.height / (Math.max(...ns) - Math.min(...ns) + 10))));
  render();
}

document.addEventListener("keydown", evt => {
  if (evt.target.tagName === "INPUT" || evt.target.tagName === "TEXTAREA" || evt.target.tagName === "SELECT") return;
  const cmd = evt.metaKey || evt.ctrlKey;
  if (evt.code === "Space") { spaceDown = true; evt.preventDefault(); }
  else if (cmd && evt.key.toLowerCase() === "z") { evt.preventDefault(); evt.shiftKey ? redo() : undo(); }
  else if (cmd && evt.key.toLowerCase() === "s") { evt.preventDefault(); save(evt.shiftKey); }
  else if (cmd && evt.key.toLowerCase() === "d") { evt.preventDefault(); duplicate(); }
  else if (evt.key === "Delete" || evt.key === "Backspace") { evt.preventDefault(); removeSelected(); }
  else if (evt.key === "Escape") { drawing = null; if (tool !== "select") setTool("select"); else { selection = null; render(); } }
  else if (evt.key === "Enter") finishPath();
  else if (!cmd && "vprct".includes(evt.key.toLowerCase())) setTool({ v: "select", p: "path", r: "rect", c: "circle", t: "note" }[evt.key.toLowerCase()]);
  else if (!cmd && evt.key.toLowerCase() === "f") fit();
  else if (!cmd && evt.key.toLowerCase() === "l") { labels = !labels; render(); }
  else if (!cmd && evt.key.toLowerCase() === "n") { showNotes = !showNotes; toast(showNotes ? "Notes shown" : "Notes hidden"); render(); }
});
document.addEventListener("keyup", evt => { if (evt.code === "Space") spaceDown = false; });
window.addEventListener("resize", render);

// ---------------------------------------------------------------- files
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
const canPick = "showSaveFilePicker" in window;
const slug = s => (s || "level").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "level";
async function save(as) {
  const text = JSON.stringify(level, null, 1) + "\n";
  if (server) {
    let name = fileName;
    if (!name || as) { name = prompt("Save as (a name in game/Assets/_Project/Levels/):", fileName || slug(level.name)); if (!name) return; name = slug(name); }
    const r = await fetch("/api/level?name=" + encodeURIComponent(name), { method: "POST", body: text });
    if (r.ok) { fileName = name; savedText = levelText(); toast("Saved Levels/" + name + ".json"); refreshLevels(); render(); }
    else toast("Couldn't save: " + (await r.text()));
    return;
  }
  if (canPick) {
    try {
      if (!fileHandle || as) fileHandle = await window.showSaveFilePicker({ suggestedName: (level.name || "level").toLowerCase().replace(/[^a-z0-9]+/g, "_") + ".json", types: [{ description: "Level", accept: { "application/json": [".json"] } }] });
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      savedText = levelText(); toast("Saved " + fileHandle.name); render(); return;
    } catch (err) { if (err && err.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = (level.name || "level").toLowerCase().replace(/[^a-z0-9]+/g, "_") + ".json";
  a.click(); toast("Downloaded " + a.download + " (move it into game/Assets/_Project/Levels/)");
}
async function refreshLevels() {
  if (!server) return;
  const sel = document.getElementById("levels");
  const names = await (await fetch("/api/levels")).json();
  sel.innerHTML = `<option value="">Open a level…</option>` + names.map(n => `<option ${n === fileName ? "selected" : ""}>${n}</option>`).join("");
  sel.hidden = false;
  document.getElementById("open").textContent = "Open a file…";
}
document.getElementById("levels").onchange = async evt => {
  const n = evt.target.value;
  if (n && dirty() && !confirm("Open " + n + "? Your unsaved changes here are lost.")) { refreshLevels(); return; }
  if (n) await openNamed(n);
};
async function openNamed(name) {
  const r = await fetch("/api/level?name=" + encodeURIComponent(name));
  if (!r.ok) { toast("No level " + name); return; }
  load(await r.text(), null); fileName = name; render();
}
// What the last session left unsaved in this browser: {fileName, level} (an older autosave: the level alone).
function autosaved() {
  try { const a = JSON.parse(localStorage.getItem("levelEditor.autosave")); return a && a.format === "level/2" ? { fileName: null, level: a } : a; } catch (_) { return null; }
}
async function open() {
  if ("showOpenFilePicker" in window) {
    try { const [h] = await window.showOpenFilePicker({ types: [{ description: "Level", accept: { "application/json": [".json"] } }] }); load(await (await h.getFile()).text(), h); return; }
    catch (err) { if (err && err.name === "AbortError") return; }
  }
  document.getElementById("fileInput").click();
}
document.getElementById("fileInput").onchange = async evt => { const f = evt.target.files[0]; if (f) load(await f.text(), null); };
function load(text, handle) {
  let data = JSON.parse(text);
  if (data.format !== "level/2") data = fromFigma(data);
  snapshot(); level = data; fileHandle = handle; fileName = null; selection = null; savedText = levelText(); fit(); toast("Opened " + (level.name || ""));
}
// (an old level, exported from the Figma file: its ground pieces and markers)
function fromFigma(d) {
  const oe = d.originE || 0, on = d.originN || 0;
  return { format: "level/2", name: "imported", scale: d.scale || 1, notes_for_the_builder: "",
    floors: (d.ground || []).filter(g => g.kind.includes("+0.5")).map(g => ({ type: "rect", top: 0.5, e: (g.e0 + g.e1) / 2 - oe, n: (g.n0 + g.n1) / 2 - on, w: g.e1 - g.e0, h: g.n1 - g.n0, rot: 0 })),
    markers: (d.markers || []).map(m => ({ code: m.code, label: m.label || "", e: m.e - oe, n: m.n - on })),
    notes: (d.notes || []).map(t => ({ text: t.text, e: t.e0 - oe, n: t.n1 - on })) };
}
document.getElementById("save").onclick = () => save(false);
document.getElementById("saveAs").onclick = () => save(true);
document.getElementById("open").onclick = open;
document.getElementById("new").onclick = () => { if (dirty() && !confirm("Start a new level? (unsaved changes are lost)")) return; snapshot(); level = blank(); fileHandle = null; fileName = null; savedText = null; selection = null; view = { cx: 0, cn: 0, ppm: 8 }; render(); };
window.addEventListener("beforeunload", evt => { if (dirty()) { evt.preventDefault(); evt.returnValue = ""; } });
document.getElementById("undo").onclick = undo;
document.getElementById("redo").onclick = redo;

// ---------------------------------------------------------------- start: ?level=path.json loads it (served), else the last session's
buildPalette();
(async () => {
  try { const r = await fetch("/api/levels"); server = r.ok; } catch (_) { server = false; }
  if (server) await refreshLevels();
  const want = new URLSearchParams(location.search).get("level");
  const left = autosaved();
  if (want && server) {
    await openNamed(want);
    // Unsaved work on this level from before (the browser keeps it as you go): offer it back.
    // (only real edits: not the file changed on disk since, e.g. by Claude, when nothing was changed here)
    const same = left && left.level && (left.fileName === want || (!left.fileName && left.level.name === level.name));
    const edited = left && left.level && (left.savedText == null || JSON.stringify(left.level) !== left.savedText);
    if (same && edited && JSON.stringify(left.level) !== savedText &&
        confirm("You have changes to " + want + " that were never saved (from your last session). Bring them back?")) {
      snapshot(); level = left.level; fit(); toast("Brought back your unsaved changes: ⌘S saves them");
    }
    return;
  }
  if (left && left.level) { level = left.level; fileName = left.fileName; fit(); return; }
  render();
})();
</script>
